# Local PostgreSQL for development and integration tests:
#   docker compose up -d
# Port 5433 avoids clashing with a Postgres already installed on 5432.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: flowfund
      POSTGRES_PASSWORD: flowfund
      POSTGRES_DB: flowfund
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowfund"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
