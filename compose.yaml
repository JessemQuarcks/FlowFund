# Local MySQL for development and integration tests:
#   docker compose up -d
# Port 3307 avoids clashing with a MySQL already installed on 3306.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: flowfund
      MYSQL_DATABASE: flowfund
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pflowfund"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
